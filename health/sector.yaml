  # A coverage survey runs under a statistical mandate rather than the Human
  # Research Act. It samples rather than recruits and it needs no identifying
  # claim, because its own sampling frame already supplies age and canton. That
  # is a different legal basis, a different entitlement and a different
  # retention rule, so it is a family of its own rather than a flow inside
  # immunization.
  - id: public-health-statistics
    title: Population health statistics
    directory: likec4-health
    status: specified
    flows:
      - id: F-11
        title: Answering the national coverage survey
        status: roadmap
        diagram: diagrams/F-11-coverage-survey.png
