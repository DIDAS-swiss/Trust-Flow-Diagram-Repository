sector: health
title: Health
noga:
  division: "86"
  division_title: Human health activities
  section: R
  section_title: Human health and social work activities
  scheme: NOGA 2025
families:
  - id: immunization
    title: Immunization and vaccination records
    directory: likec4-health
    status: in-progress
    # No `functions` block, deliberately.
    #
    # This family spans ten flows with different primary functions: actor
    # onboarding, credential issuance, evidence presentation, practice check-in,
    # prescription redemption, lifecycle correction, a local projection into
    # FHIR and openEHR, IPS composition, secondary research use and continuous
    # measurement. Naming one of them primary would be picking a dominant
    # narrative rather than classifying the work, and this document's own rule
    # says a family whose flows have different primary functions is a family
    # worth splitting.
    #
    # Splitting the health architecture is a design decision that needs its own
    # change. Until then the honest position is either smaller canonical
    # families or flow-level classification, and a missing functions block is a
    # note rather than a failure.
    flows:
      - id: F-01
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        title: Becoming an actor in the health trust domain
        status: partial
        diagram: diagrams/F-01-becoming-an-actor.png
      - id: F-02
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        title: Recording an administered dose
        status: implemented
        diagram: diagrams/F-02-recording-a-dose.png
      - id: F-03
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-08, GP-09]
        title: Presenting vaccination evidence with minimal disclosure
        status: implemented
        diagram: diagrams/F-03-minimal-disclosure.png
      - id: F-04
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-01]
        title: Check-in at the practice
        status: implemented
        diagram: diagrams/F-04-practice-check-in.png
      - id: F-05
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-06]
        title: Prescription and its redemption
        status: implemented
        diagram: diagrams/F-05-prescription-redemption.png
      - id: F-06
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-06, GP-07]
        title: Correction, suspension and revocation
        status: partial
        diagram: diagrams/F-06-correction.png
      - id: F-07
        kind: transformation
        interaction_scope: local
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-02]
        title: Projecting a presented credential into FHIR and openEHR
        status: implemented
      - id: F-08
        kind: flow
        interaction_scope: multi-party
        composition: composed
        data_mode: discrete
        profile_status: beyond-current-profile
        profile_gaps: [GP-01, GP-02, GP-10]
        title: Assembling an International Patient Summary from held credentials
        status: roadmap
      - id: F-09
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: beyond-current-profile
        profile_gaps: [GP-03]
        title: Secondary use under revocable research consent
        status: roadmap
      - id: F-10
        kind: flow
        interaction_scope: unresolved
        composition: unresolved
        data_mode: continuous
        profile_status: beyond-current-profile
        profile_gaps: [GP-04, GP-05]
        title: Wearables and continuous data
        status: roadmap

  # A coverage survey runs under a statistical mandate rather than the Human
  # Research Act. It samples rather than recruits, and the stratum the analysis
  # needs arrives inside the invitation credential the survey issues, so the
  # presentation request names no person identifier. That is a different legal
  # basis, a different entitlement and a different retention rule, so it is a
  # family of its own rather than a flow inside immunization.
  - id: public-health-statistics
    title: Population health statistics
    directory: likec4-health
    status: specified
    # No `functions` block, deliberately.
    #
    # research-and-development is the closest entry in the catalogue and it is
    # the wrong one. F-11 is separated from F-09 precisely because a coverage
    # survey runs under a statistical mandate rather than the Human Research
    # Act, which changes the legal basis, the entitlement and the retention
    # rule. Filing official vaccination-coverage statistics under "Research and
    # development" would reintroduce the distinction the health model was built
    # to keep.
    #
    # The catalogue has no official-statistics or population-analytics
    # function. If that is a reusable cross-sector function it belongs upstream
    # in industry-function-graph first, and is then synchronised here. An
    # approximate classification is not a substitute for the missing entry.
    flows:
      - id: F-11
        kind: flow
        interaction_scope: multi-party
        composition: atomic
        data_mode: discrete
        profile_status: mixed
        profile_gaps: [GP-08, GP-09]
        title: Answering the national coverage survey
        status: roadmap
        diagram: diagrams/F-11-coverage-survey.png
