# DO NOT EDIT. Generated by scripts/check-classification.py from
# noga-2025.yaml, functions.yaml and the sector.yaml files.
# Regenerate with: python3 scripts/check-classification.py --issue-form
#
# GitHub renders dropdowns in issue forms and not in pull request
# templates, so the pickable version of the classification lives here.

name: Propose a new flow
description: Classify a trust flow before writing it, so the sector and the function are settled while it is fresh.
title: "[flow] "
body:
  - type: markdown
    attributes:
      value: "Every field below is a choice from the codified lists. If what you need is missing, pick the *not listed* option and add the row in the pull request — that is the intended way to extend either catalogue, not a workaround."
  - type: dropdown
    id: sector
    attributes:
      label: "Sector directory"
      description: "The industry the relying party operates in, not the industry of whoever wrote the flow. A bank verifying a school certificate is a banking flow."
      options:
        - "banking — Banking (division 64)"
        - "education — Education (division 85)"
        - "a new sector — not listed above"
    validations:
      required: true
  - type: dropdown
    id: division
    attributes:
      label: "NOGA division"
      description: "Identical to the ISIC Rev. 5 division. Key on this number rather than the section letter: letters move between revisions, numbers do not."
      options:
        - "01 — Crop and animal production, hunting and related service activities (section A)"
        - "08 — Other mining and quarrying (section B)"
        - "10 — Manufacture of food products (section C)"
        - "36 — Water collection, treatment and supply (section E)"
        - "37 — Sewerage (section E)"
        - "38 — Waste collection, recovery and disposal activities (section E)"
        - "39 — Remediation activities and other waste management service activities (section E)"
        - "46 — Wholesale trade (section G)"
        - "47 — Retail trade (section G)"
        - "49 — Land transport and transport via pipelines (section H)"
        - "61 — Telecommunication (section K)"
        - "64 — Financial service activities, except insurance and pension funding (section L) — already banking/"
        - "65 — Insurance, reinsurance and pension funding, except compulsory social security (section L)"
        - "66 — Activities auxiliary to financial services and insurance activities (section L)"
        - "68 — Real estate activities (section M)"
        - "78 — Employment activities (section O)"
        - "84 — Public administration and defence; compulsory social security (section P)"
        - "85 — Education (section Q) — already education/"
        - "86 — Human health activities (section R) — already health/"
        - "87 — Residential care activities (section R)"
        - "94 — Activities of membership organisations (section T)"
        - "98 — Undifferentiated goods- and service-producing activities of private households for own use (section U)"
        - "99 — Activities of extraterritorial organisations and bodies (section V)"
        - "not listed — I will add the row to noga-2025.yaml"
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: "Family"
      description: "A family groups flows that share a trigger and a set of actors. Pick the one this joins, or say it starts a new one."
      options:
        - "banking/kyc-credential — KYC credential"
        - "banking/re-identification-forgotten-password — Re-identification after a forgotten password"
        - "banking/re-identification-age-of-majority — Re-identification at the age of majority"
        - "basic-flow/trust-infrastructure — The trust infrastructure itself"
        - "education/certificates-and-enrolment — Certificates and enrolment"
        - "a new family — described below"
    validations:
      required: true
  - type: dropdown
    id: function
    attributes:
      label: "Primary function"
      description: "What kind of work this is, independent of the sector. The one thing the family exists to do; supporting functions go in sector.yaml."
      options:
        - "identity-proofing — Identity proofing"
        - "identity-lifecycle-management — Identity lifecycle management"
        - "customer-onboarding — Customer onboarding"
        - "eligibility-verification — Eligibility verification"
        - "access-management — Access management"
        - "certification-and-attestation — Certification and attestation"
        - "regulatory-compliance — Regulatory compliance"
        - "sourcing-and-procurement — Sourcing and procurement"
        - "supply-chain-traceability — Supply chain traceability"
        - "human-capital-management — Human capital management"
        - "customer-service — Customer service"
        - "service-delivery — Service delivery"
        - "records-management — Records management"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "What the flow shows"
      description: "A sentence or two. Who exchanges what with whom, and where the trust decision happens."
    validations:
      required: true
  - type: textarea
    id: uncertainty
    attributes:
      label: "Anything you are unsure about"
      description: "Uncertain about the division or the function? Say so rather than guessing quietly. Picking the wrong one is cheap to fix now and expensive once other flows have copied it."
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: "Before submitting"
      options:
        - label: "I ran python3 scripts/check-classification.py, or this flow has no sector.yaml change yet"
