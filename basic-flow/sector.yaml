# The reference model is not a sector. It is the flow every sector flow
# abstracts, so it carries no NOGA classification.
sector: basic-flow
title: Basic flow
reference_model: true
noga: null
families:
  - id: trust-infrastructure
    title: The trust infrastructure itself
    status: stable
    states:
      # The reference model is what every other family requires and nothing
      # requires it. It is the root of the composition graph.
      requires: []
      establishes: [eid-held]
    flows:
      - id: registration
        title: Registration and trust setup
      - id: issuance
        title: Credential issuance
      - id: verification
        title: Credential verification
  - id: unlinkable-presentation
    title: Unlinkable presentation of the e-ID
    directory: Unlinkable e-ID use
    status: draft
    # A reusable block: sector flows use it for their presentation step and
    # require the state it establishes. The six-verifier walkthrough shows it
    # used by verifiers in five sectors.
    functions:
      primary: eligibility-verification
      supporting: [identity-proofing]
    states:
      requires: [eid-held]
      establishes: [age-attribute-proven, identity-verified]
    flows:
      - id: unlinkable-presentation
        title: Unlinkable presentation of the e-ID
        status: specified
      - id: six-verifier-walkthrough
        title: Unlinkable e-ID use at a nightclub, hotel, Coop, vending machine, adult website and Swisscom
        status: specified
