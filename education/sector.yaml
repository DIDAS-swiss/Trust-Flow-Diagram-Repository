sector: education
title: Education
noga:
  division: "85"
  division_title: Education
  section: Q
  section_title: Education
  scheme: NOGA 2025
families:
  # The first family keeps its flows directly under the sector directory.
  # Families added later have their own subdirectory.
  - id: certificates-and-enrolment
    title: Certificates and enrolment
    status: in-progress
    states:
      # Two establishes because two kinds of work share this family: the school
      # issues, the university enrols. Splitting the family would split these.
      requires: [eid-held]
      establishes: [secondary-education-credential-held, tertiary-enrolment-established]
    functions:
      # Two kinds of work in one family: the school issues a certificate,
      # the university onboards a student. If this family is ever split,
      # the second half takes relationship-onboarding as its primary.
      primary: certification-and-attestation
      supporting: [relationship-onboarding, eligibility-verification, identity-proofing, records-management]
    flows:
      - id: high-school-certificate-issuance
        title: High school certificate issuance
      - id: university-immatriculation
        title: University immatriculation
  - id: matura-credential-without-eid
    title: Matura credential without the e-ID
    directory: Matura credential without e-ID
    status: draft
    states:
      # The student is identified with the school account, so the family does
      # not require eid-held, unlike certificates-and-enrolment.
      requires: []
      establishes: [secondary-education-credential-held]
    functions:
      primary: certification-and-attestation
      supporting: [eligibility-verification, records-management]
    flows:
      - id: matura-credential-issuance
        title: Issuing a Matura credential without the e-ID (DIDAS proposal)
        status: specified
